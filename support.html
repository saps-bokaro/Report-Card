<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner support inbox</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background: linear-gradient(135deg, #eef2ff, #f8fafc 55%, #e0f2fe);
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    }
    .inbox {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      width: min(100%, 1000px);
      min-height: min(720px, calc(100vh - 48px));
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid #e7eaf2;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(39, 55, 99, 0.12);
    }
    .sidebar { padding: 24px 16px; border-right: 1px solid #e7eaf2; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    .subtle { color: #687386; line-height: 1.5; }
    #chatList { display: grid; gap: 8px; margin-top: 24px; }
    .chat-select {
      width: 100%; padding: 12px; border: 1px solid #e7eaf2; border-radius: 10px;
      background: #fff; color: #172033; text-align: left; cursor: pointer;
    }
    .chat-select[aria-current="true"] { border-color: #5c6ac4; background: #f4f5ff; }
    .chat-group { min-width: 0; }
    .chat-group-title { margin: 16px 0 8px; color: #687386; font-size: .82rem; font-weight: 700; }
    .chat-group-list { display: grid; gap: 8px; }
    .conversation { display: flex; min-width: 0; flex-direction: column; padding: 24px; }
    .conversation-header { padding-bottom: 16px; border-bottom: 1px solid #e7eaf2; }
    .conversation-header h2 { margin: 0; font-size: 1.25rem; }
    .document-manager { padding: 14px 0; border-bottom: 1px solid #e7eaf2; }
    .document-manager[hidden] { display: none; }
    .document-manager p { margin: 0 0 10px; color: #687386; }
    .document-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 10px 0; }
    .document-controls input[type="file"], .document-controls input[type="url"] { min-width: 0; flex: 1; }
    .document-controls button { padding: 9px 12px; border: 0; border-radius: 8px; background: #5c6ac4; color: #fff; font: inherit; cursor: pointer; }
    .document-controls button.remove-document { background: #b42318; }
    .document-preview { display: block; width: 100%; height: min(65vh, 680px); margin-top: 14px; border: 1px solid #e7eaf2; border-radius: 10px; background: #f8fafc; }
    #documentStatus { margin-top: 8px; font-size: .9rem; }
    #messages {
      display: flex; flex: 1; flex-direction: column; align-items: flex-start; gap: 10px;
      min-height: 280px; max-height: 60vh; padding: 18px 4px; overflow-y: auto;
    }
    .message {
      max-width: min(80%, 560px); margin: 0; padding: 10px 13px; border-radius: 12px;
      background: #f0f2fb; overflow-wrap: anywhere; white-space: pre-wrap;
    }
    .message.visitor { align-self: flex-end; background: #5c6ac4; color: #fff; }
    .message-meta { display: block; margin-bottom: 4px; font-size: .72rem; opacity: .75; }
    form { display: flex; gap: 10px; }
    input {
      min-width: 0; flex: 1; padding: 13px 14px; border: 1px solid #d7dce7;
      border-radius: 10px; font: inherit;
    }
    button.send, .logout {
      padding: 12px 18px; border: 0; border-radius: 10px; background: #5c6ac4;
      color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    }
    .backup-button {
      width: 100%; margin-top: 18px; padding: 10px 12px; border: 1px solid #cbd5e1;
      border-radius: 8px; background: #fff; color: #172033; font: inherit; font-weight: 700; cursor: pointer;
    }
    #backupStatus { min-height: 1.5em; margin: 8px 0 0; font-size: .85rem; }
    .logout { margin-top: 20px; background: transparent; color: #4c59ad; padding: 0; }
    .empty { margin: auto; color: #687386; text-align: center; }
    @media (max-width: 640px) {
      body { padding: 12px; }
      .inbox { grid-template-columns: 1fr; min-height: calc(100vh - 24px); }
      .sidebar { padding: 18px; border-right: 0; border-bottom: 1px solid #e7eaf2; }
      #chatList { display: flex; max-width: 100%; overflow-x: auto; }
      .chat-group { flex: 0 0 auto; }
      .chat-select { width: auto; flex: 0 0 auto; }
      .conversation { min-height: 460px; padding: 18px; }
      #messages { max-height: 45vh; }
    }
  </style>
</head>
<body>
  <main class="inbox">
    <aside class="sidebar">
      <h1>Support inbox</h1>
      <p class="subtle">Verified Reg nos. and existing chats are listed here.</p>
      <div id="chatList" aria-label="Chats"></div>
      <p class="subtle" id="noChats">No verified registrations or chats found.</p>
      <button class="backup-button" id="backupChats" type="button">Download chat backup</button>
      <p class="subtle" id="backupStatus" role="status" aria-live="polite"></p>
      <button class="logout" id="logout" type="button">Log out</button>
    </aside>
    <section class="conversation" aria-label="Selected chat">
      <header class="conversation-header">
        <h2 id="conversationTitle">Select a chat</h2>
      </header>
      <section class="document-manager" id="documentManager" hidden aria-label="Manage student document">
        <p id="documentCurrent">No document attached.</p>
        <form id="documentForm" class="document-controls">
          <input id="documentFile" type="file" accept="application/pdf,.pdf" aria-label="Choose a PDF document" required>
          <button type="submit">Attach PDF</button>
          <button class="remove-document" id="removeDocument" type="button" hidden>Remove document</button>
        </form>
        <form id="documentLinkForm" class="document-controls">
          <input id="documentUrl" type="url" placeholder="https://... document link" aria-label="Hosted document link" required>
          <button type="submit">Save link</button>
        </form>
        <div id="documentPreviewContainer"></div>
        <p id="documentStatus" aria-live="polite">Attach a PDF here or paste a hosted document link.</p>
      </section>
      <div id="messages" role="log" aria-live="polite">
        <p class="empty">Choose a Reg no. to view its conversation.</p>
      </div>
      <form id="replyForm" hidden>
        <input id="replyInput" type="text" aria-label="Your reply" placeholder="Write a reply..." maxlength="4000" required autocomplete="off">
        <button class="send" type="submit">Send</button>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.body.hidden = true;
    const supabaseUrl = 'https://knjrhohyesqxsoessmnr.supabase.co';
    const supabasePublishableKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuanJob2h5ZXNxeHNvZXNzbW5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NzAxNDQsImV4cCI6MjEwNjI0NjE0NH0.rI26D8ZACBDkKtQ7slJE3kOhDeV3LXfRT7astsPo61o';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabasePublishableKey);

    const prefix = 'registration-chat:';
    const chatList = document.getElementById('chatList');
    const noChats = document.getElementById('noChats');
    const backupStatus = document.getElementById('backupStatus');
    const messages = document.getElementById('messages');
    const title = document.getElementById('conversationTitle');
    const replyForm = document.getElementById('replyForm');
    const replyInput = document.getElementById('replyInput');
    const documentManager = document.getElementById('documentManager');
    const documentForm = document.getElementById('documentForm');
    const documentFile = document.getElementById('documentFile');
    const documentLinkForm = document.getElementById('documentLinkForm');
    const documentUrl = document.getElementById('documentUrl');
    const documentCurrent = document.getElementById('documentCurrent');
    const documentPreviewContainer = document.getElementById('documentPreviewContainer');
    const documentStatus = document.getElementById('documentStatus');
    const removeDocument = document.getElementById('removeDocument');
    let activeChat = null;
    let activeDocumentUrl = '';
    let legacyImportComplete = false;

    async function renderDocumentManager() {
      documentManager.hidden = !activeChat;
      documentCurrent.replaceChildren();
      documentPreviewContainer.replaceChildren();
      removeDocument.hidden = true;
      activeDocumentUrl = '';
      if (!activeChat) return;
      const regNo = activeChat.regNo;
      const { data: registration, error } = await supabaseClient
        .from('registrations')
        .select('url')
        .eq('reg_no', regNo)
        .maybeSingle();
      if (error) {
        documentCurrent.textContent = 'Could not load this document.';
        return;
      }
      activeDocumentUrl = registration?.url || '';
      let previewUrl = '';
      if (activeDocumentUrl) {
        try {
          const parsedUrl = new URL(activeDocumentUrl);
          if (parsedUrl.protocol === 'https:' || parsedUrl.protocol === 'http:') previewUrl = parsedUrl.href;
        } catch {
          previewUrl = '';
        }
      }

      if (!previewUrl) {
        documentCurrent.textContent = 'No document attached.';
        removeDocument.hidden = true;
        return;
      }

      const link = document.createElement('a');
      link.href = previewUrl;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = 'Open saved document';
      documentCurrent.append(link);

      const preview = document.createElement('iframe');
      preview.className = 'document-preview';
      preview.src = previewUrl;
      preview.title = 'Preview of saved document';
      preview.referrerPolicy = 'no-referrer';
      documentPreviewContainer.append(preview);
      removeDocument.hidden = false;
    }

    function readMessages(key) {
      try {
        const data = JSON.parse(localStorage.getItem(key) || '[]');
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    async function fetchAllChatMessages() {
      const pageSize = 1000;
      const rows = [];
      for (let offset = 0; ; offset += pageSize) {
        const { data, error } = await supabaseClient
          .from('chat_messages')
          .select('reg_no, class_name, sender, message, created_at')
          .order('class_name')
          .order('reg_no')
          .order('created_at')
          .range(offset, offset + pageSize - 1);
        if (error) throw error;
        rows.push(...(data || []));
        if (!data || data.length < pageSize) return rows;
      }
    }

    async function importLegacyChats(registrations) {
      if (legacyImportComplete) return;
      const registrationsByNumber = new Map();
      for (const registration of registrations) {
        const matches = registrationsByNumber.get(registration.reg_no) || [];
        matches.push(registration);
        registrationsByNumber.set(registration.reg_no, matches);
      }

      const rows = [];
      for (let index = 0; index < localStorage.length; index += 1) {
        const storageKey = localStorage.key(index);
        if (!storageKey || !storageKey.startsWith(prefix)) continue;
        const regNo = storageKey.slice(prefix.length);
        const matches = registrationsByNumber.get(regNo) || [];
        if (matches.length !== 1) continue;
        const className = matches[0].class_name;
        readMessages(storageKey).forEach((item, messageIndex) => {
          const legacyMessage = typeof item === 'string' ? { text: item } : item;
          if (!legacyMessage || typeof legacyMessage.text !== 'string' || !legacyMessage.text.trim()) return;
          const legacyDate = Number.isFinite(legacyMessage.time) ? new Date(legacyMessage.time) : null;
          rows.push({
            reg_no: regNo,
            class_name: className,
            sender: legacyMessage.sender === 'support' ? 'support' : 'visitor',
            message: legacyMessage.text.trim(),
            legacy_id: `local:${encodeURIComponent(className)}:${encodeURIComponent(regNo)}:${messageIndex}`,
            ...(legacyDate && Number.isFinite(legacyDate.getTime()) ? { created_at: legacyDate.toISOString() } : {})
          });
        });
      }

      const batchSize = 500;
      for (let offset = 0; offset < rows.length; offset += batchSize) {
        const { error } = await supabaseClient
          .from('chat_messages')
          .upsert(rows.slice(offset, offset + batchSize), { onConflict: 'legacy_id', ignoreDuplicates: true });
        if (error) throw error;
      }
      legacyImportComplete = true;
      if (rows.length) {
        backupStatus.textContent = `Imported existing messages from this browser (${rows.length} checked).`;
      }
    }

    document.getElementById('backupChats').addEventListener('click', async () => {
      backupStatus.textContent = 'Preparing backup...';
      try {
        const rows = await fetchAllChatMessages();
        const groupedChats = new Map();
        for (const row of rows) {
          const key = `${row.class_name}\u0000${row.reg_no}`;
          const chat = groupedChats.get(key) || {
            className: row.class_name,
            registrationNumber: row.reg_no,
            messages: []
          };
          chat.messages.push({
            sender: row.sender,
            text: row.message,
            time: Date.parse(row.created_at),
            createdAt: row.created_at
          });
          groupedChats.set(key, chat);
        }

        const chats = [...groupedChats.values()];
        const backup = {
          format: 'registration-chat-backup',
          version: 1,
          createdAt: new Date().toISOString(),
          chats
        };
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const downloadUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = downloadUrl;
        link.download = `chat-backup-${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        window.setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
        backupStatus.textContent = `Backed up ${chats.length} chats and ${rows.length} messages.`;
      } catch (error) {
        console.error('Chat backup failed:', error);
        backupStatus.textContent = 'Could not download the Supabase chat backup.';
      }
    });

    async function renderMessages() {
      messages.replaceChildren();
      if (!activeChat) return;
      const selectedChat = activeChat;
      const { data: history, error } = await supabaseClient
        .from('chat_messages')
        .select('sender, message, created_at')
        .eq('reg_no', selectedChat.regNo)
        .eq('class_name', selectedChat.className)
        .order('created_at')
        .order('id');
      if (activeChat !== selectedChat) return;
      if (error) {
        const failed = document.createElement('p');
        failed.className = 'empty';
        failed.textContent = 'Could not load this chat. Try again.';
        messages.append(failed);
        return;
      }
      if (!history || !history.length) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'No messages yet.';
        messages.append(empty);
        return;
      }
      history.forEach((item) => {
        const fromSupport = item.sender === 'support';
        const bubble = document.createElement('p');
        bubble.className = `message${fromSupport ? '' : ' visitor'}`;
        const sender = document.createElement('span');
        sender.className = 'message-meta';
        sender.textContent = fromSupport ? 'You' : 'Visitor';
        bubble.append(sender, document.createTextNode(item.message));
        messages.append(bubble);
      });
      messages.scrollTop = messages.scrollHeight;
    }

    async function renderChatList() {
      const { data: registrations, error } = await supabaseClient
        .from('registrations')
        .select('reg_no, class_name')
        .order('class_name')
        .order('reg_no');
      if (error) {
        chatList.replaceChildren();
        noChats.textContent = 'Could not load registrations. Try reloading.';
        noChats.hidden = false;
        return;
      }
      chatList.replaceChildren();
      noChats.hidden = registrations.length > 0;
      noChats.textContent = 'No registrations found.';
      let currentGroup = null;
      for (const registration of registrations) {
        if (!currentGroup || currentGroup.className !== registration.class_name) {
          const group = document.createElement('section');
          group.className = 'chat-group';
          const groupTitle = document.createElement('h2');
          groupTitle.className = 'chat-group-title';
          groupTitle.textContent = `Class ${registration.class_name}`;
          const groupList = document.createElement('div');
          groupList.className = 'chat-group-list';
          group.append(groupTitle, groupList);
          chatList.append(group);
          currentGroup = { className: registration.class_name, list: groupList };
        }

        const selected = activeChat?.regNo === registration.reg_no
          && activeChat?.className === registration.class_name;
        const button = document.createElement('button');
        button.className = 'chat-select';
        button.type = 'button';
        button.textContent = `Reg no. ${registration.reg_no}`;
        button.setAttribute('aria-current', String(selected));
        button.addEventListener('click', () => {
          activeChat = { regNo: registration.reg_no, className: registration.class_name };
          title.textContent = `Class ${registration.class_name}, Reg no. ${registration.reg_no}`;
          replyForm.hidden = false;
          renderChatList();
          renderMessages();
          renderDocumentManager();
          replyInput.focus();
        });
        currentGroup.list.append(button);
      }
      try {
        await importLegacyChats(registrations);
      } catch (importError) {
        console.error('Existing local chats could not be imported:', importError);
        backupStatus.textContent = 'Could not import existing chats from this browser.';
      }
    }

    async function saveDocumentUrl(regNo, url) {
      const { data, error } = await supabaseClient
        .from('registrations')
        .update({ url })
        .eq('reg_no', regNo)
        .select('reg_no')
        .maybeSingle();
      if (error) throw error;
      if (!data) throw new Error('Registration not found.');
    }

    documentForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const file = documentFile.files[0];
      if (!file || !activeChat) return;
      if (!file.name.toLowerCase().endsWith('.pdf') && file.type !== 'application/pdf') {
        documentStatus.textContent = 'Please choose a PDF file.';
        return;
      }
      if (file.size > 1.5 * 1024 * 1024) {
        documentStatus.textContent = 'That PDF is too large. Choose a file under 1.5 MB.';
        return;
      }

      const regNo = activeChat.regNo;
      const safeRegNo = regNo.replace(/[^a-zA-Z0-9_-]/g, '_');
      const safeFileName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const objectPath = `${safeRegNo}/${crypto.randomUUID()}-${safeFileName}`;
      let uploadedPath = '';
      documentStatus.textContent = 'Uploading PDF...';
      try {
        const { error: uploadError } = await supabaseClient.storage
          .from('student-documents')
          .upload(objectPath, file, { contentType: 'application/pdf', upsert: false });
        if (uploadError) throw uploadError;
        uploadedPath = objectPath;
        const { data: publicDocument } = supabaseClient.storage
          .from('student-documents')
          .getPublicUrl(objectPath);
        await saveDocumentUrl(regNo, publicDocument.publicUrl);
        documentStatus.textContent = 'PDF backed up and attached.';
        documentFile.value = '';
        await renderDocumentManager();
      } catch (error) {
        if (uploadedPath) {
          await supabaseClient.storage.from('student-documents').remove([uploadedPath]);
        }
        console.error('PDF upload failed:', error);
        documentStatus.textContent = 'Could not upload the PDF. Check your Supabase setup and try again.';
      }
    });

    documentLinkForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!activeChat) return;
      let parsedUrl;
      try {
        parsedUrl = new URL(documentUrl.value.trim());
      } catch {
        documentStatus.textContent = 'Enter a valid full document URL.';
        return;
      }
      if (parsedUrl.protocol !== 'https:' && parsedUrl.protocol !== 'http:') {
        documentStatus.textContent = 'Document links must start with http:// or https://.';
        return;
      }
      try {
        await saveDocumentUrl(activeChat.regNo, parsedUrl.href);
        documentStatus.textContent = 'Document link backed up.';
        documentUrl.value = '';
        await renderDocumentManager();
      } catch (error) {
        console.error('Document link save failed:', error);
        documentStatus.textContent = 'Could not save the link to Supabase.';
      }
    });

    removeDocument.addEventListener('click', async () => {
      if (!activeChat) return;
      try {
        const regNo = activeChat.regNo;
        const savedUrl = activeDocumentUrl;
        const parsedUrl = new URL(savedUrl);
        const storagePathPrefix = '/storage/v1/object/public/student-documents/';
        if (parsedUrl.origin === new URL(supabaseUrl).origin && parsedUrl.pathname.startsWith(storagePathPrefix)) {
          const objectPath = decodeURIComponent(parsedUrl.pathname.slice(storagePathPrefix.length));
          const { error } = await supabaseClient.storage.from('student-documents').remove([objectPath]);
          if (error) throw error;
        }
        await saveDocumentUrl(regNo, null);
        documentStatus.textContent = 'Document removed from Supabase.';
        await renderDocumentManager();
      } catch (error) {
        console.error('Document removal failed:', error);
        documentStatus.textContent = 'Could not remove this document from Supabase.';
      }
    });

    replyForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = replyInput.value.trim();
      if (!text || !activeChat) return;
      try {
        const { error } = await supabaseClient.from('chat_messages').insert({
          reg_no: activeChat.regNo,
          class_name: activeChat.className,
          sender: 'support',
          message: text
        });
        if (error) throw error;
      } catch (error) {
        console.error('Support reply failed:', error);
        window.alert('Could not save this reply to Supabase.');
        return;
      }
      replyInput.value = '';
      renderMessages();
    });

    window.setInterval(() => {
      if (activeChat) renderMessages().catch((error) => console.error('Chat refresh failed:', error));
    }, 5000);

    document.getElementById('logout').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    });

    async function initializeSupportPage() {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error || !data.session) {
        window.location.replace('index.html');
        return;
      }
      document.body.hidden = false;
      await renderChatList();
    }

    initializeSupportPage();
  </script>
</body>
</html>
